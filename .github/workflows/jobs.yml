name: Jobes Test

on:
  workflow_run:
    workflows: ["my Workflow"]
    types:
      - completed

jobs:
  validate-html:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: get-repo-code
        uses: actions/checkout@v6

      - name: Validate html file
        run: test -f index.html

  validate-js:
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v6

      - name: Validate js file
        run: test -f script.js
  validate-code:
    needs: [validate-html, validate-js]
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v6

      - name: Validate code file
        run: node -c script.js

      - name: Validate code file
        run: npx htmlhint index.html
